server:
  port: 8080

app:
  services:
    identity: http://${IDENTITY_SERVICE_HOST:localhost}:8081

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:bookland123}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedHeaders: "*"
            allowedMethods: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST
        - DedupeResponseHeader=Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # Identity Service
        - id: identity-service
          uri: http://${IDENTITY_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/auth/**, /api/users/**, /api/roles/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        # Identity Service API Docs
        - id: identity-service-api-docs
          uri: http://${IDENTITY_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/identity-service/v3/api-docs
          filters:
            - RewritePath=/identity-service/v3/api-docs, /v3/api-docs

        # User Service
        - id: user-service
          uri: http://${USER_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/users/**, /api/addresses/**, /api/wishlists/**

        # User Service API Docs
        - id: user-service-api-docs
          uri: http://${USER_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/v3/api-docs, /v3/api-docs

        # File Service
        - id: file-service
          uri: http://${FILE_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/v1/files/**

        # File Service API Docs
        - id: file-service-api-docs
          uri: http://${FILE_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/file-service/v3/api-docs
          filters:
            - RewritePath=/file-service/v3/api-docs, /v3/api-docs

        # Meeting Service
        - id: meeting-service
          uri: http://${MEETING_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/v1/meetings/**

        # Meeting Service API Docs
        - id: meeting-service-api-docs
          uri: http://${MEETING_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/meeting-service/v3/api-docs
          filters:
            - RewritePath=/meeting-service/v3/api-docs, /v3/api-docs

        # Transcript Service
        - id: transcript-service
          uri: http://${TRANSCRIPT_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/api/v1/transcripts, /api/v1/transcripts/, /api/v1/transcripts/file/**, /api/v1/transcripts/generate

        # Transcript Service API Docs
        - id: transcript-service-api-docs
          uri: http://${TRANSCRIPT_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/transcript-service/v3/api-docs
          filters:
            - RewritePath=/transcript-service/v3/api-docs, /v3/api-docs


resilience4j:
  circuitbreaker:


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    urls:
      - name: Identity Service
        url: /identity-service/v3/api-docs
      - name: User Service
        url: /user-service/v3/api-docs
      - name: File Service
        url: /file-service/v3/api-docs
      - name: Meeting Service
        url: /meeting-service/v3/api-docs
      - name: Transcript Service
        url: /transcript-service/v3/api-docs

