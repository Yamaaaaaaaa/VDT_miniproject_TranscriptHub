server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  # Tắt login page mặc định của Spring Security (xác thực do Gateway xử lý)
  security:
    user:
      name: disabled
      password: disabled

services:
  book-service:
    url: http://${BOOK_SERVICE_HOST:localhost}:8083

logging:
  level:
    com.bookland.user: DEBUG
    org.springframework.security: WARN
