version: '3.8'


services:
  mysql-db:
    image: mysql:8.0
    container_name: transcript_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: transcript_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass bookland123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bookland123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  identity-service:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    container_name: identity-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=bookland123
      - USER_SERVICE_HOST=user-service
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  user-service:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=bookland123
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  api-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - IDENTITY_SERVICE_HOST=identity-service
      - USER_SERVICE_HOST=user-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=bookland123
    depends_on:
      identity-service:
        condition: service_started
      user-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

volumes:
  mysql_data:
  redis_data:
