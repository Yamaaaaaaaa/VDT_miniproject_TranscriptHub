version: '3.8'

services:
  # 1. PostgreSQL Container
  postgres:
    image: postgres:15-alpine
    container_name: transcripthub-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcripthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcripthub_net

  # Redis Container for JWT Blacklisting
  redis:
    image: redis:7-alpine
    container_name: transcripthub-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - transcripthub_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO Object Storage Container
  minio:
    image: minio/minio:latest
    container_name: transcripthub-minio
    restart: always
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: "http://localhost:9100"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcripthub_net

  # Initialize MinIO Buckets
  minio-init:
    image: minio/mc:latest
    container_name: transcripthub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/transcripthub-bucket || true;
      mc anonymous set public myminio/transcripthub-bucket || true;
      exit 0;
      "
    networks:
      - transcripthub_net

  # 2. Database Migration and Seeding
  migrate:
    build:
      context: ./services_ms
      dockerfile: apps/users/Dockerfile
      target: builder
    container_name: transcripthub-db-migrate
    command: >
      sh -c "npx prisma db push --url postgresql://postgres:postgres@postgres:5432/transcripthub --accept-data-loss && npx prisma db seed"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/transcripthub
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcripthub_net
    restart: on-failure

  # 3. Users Microservice (TCP :3001)
  users-service:
    build:
      context: ./services_ms
      dockerfile: apps/users/Dockerfile
      target: production
    container_name: transcripthub-users-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/transcripthub
      USERS_SERVICE_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - transcripthub_net

  # 4. Identity Microservice (TCP :3002)
  identity-service:
    build:
      context: ./services_ms
      dockerfile: apps/identity/Dockerfile
      target: production
    container_name: transcripthub-identity-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/transcripthub
      USERS_SERVICE_HOST: users-service
      USERS_SERVICE_PORT: 3001
      IDENTITY_SERVICE_PORT: 3002
      JWT_SECRET: "th_jwt_s3cr3t_k3y_x9mK2pL8qR4nW6vY1bZ5cE0aF7gH3jN"
      JWT_REFRESH_SECRET: "th_refresh_s3cr3t_k3y_p2mX8nL4qK9vR6bW1zY5cE0aF7gH3jN"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3002:3002"
    depends_on:
      users-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - transcripthub_net

  # 4b. File Microservice (HTTP :3003, TCP :3004)
  file-service:
    build:
      context: ./services_ms
      dockerfile: apps/file/Dockerfile
      target: production
    container_name: transcripthub-file-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/transcripthub
      FILE_SERVICE_PORT: 3003
      FILE_SERVICE_TCP_PORT: 3004
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: transcripthub-bucket
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: 9100
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "3003:3003"
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - transcripthub_net

  # Zookeeper for Kafka Coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: transcripthub-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - transcripthub_net

  # Apache Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: transcripthub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - transcripthub_net

  # 4c. Transcript Microservice (TCP :3005)
  transcript-service:
    build:
      context: ./services_ms
      dockerfile: apps/transcript/Dockerfile
      target: production
    container_name: transcripthub-transcript-service
    restart: always
    env_file:
      - ./services_ms/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/transcripthub
      TRANSCRIPT_SERVICE_TCP_PORT: 3005
      FILE_SERVICE_HOST: file-service
      FILE_SERVICE_PORT: 3003
      FILE_SERVICE_TCP_PORT: 3004
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      file-service:
        condition: service_started
    networks:
      - transcripthub_net

  # 4d. Meeting Microservice (TCP :3006)
  meeting-service:
    build:
      context: ./services_ms
      dockerfile: apps/meeting/Dockerfile
      target: production
    container_name: transcripthub-meeting-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/transcripthub
      MEETING_SERVICE_TCP_PORT: 3006
      USERS_SERVICE_HOST: users-service
      USERS_SERVICE_PORT: 3001
      FILE_SERVICE_HOST: file-service
      FILE_SERVICE_PORT: 3003
      FILE_SERVICE_TCP_PORT: 3004
      TRANSCRIPT_SERVICE_HOST: transcript-service
      TRANSCRIPT_SERVICE_TCP_PORT: 3005
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      users-service:
        condition: service_started
      file-service:
        condition: service_started
      transcript-service:
        condition: service_started
    networks:
      - transcripthub_net

  # 4e. Collab Microservice (TCP :3007)
  collab-service:
    build:
      context: ./services_ms
      dockerfile: apps/collab/Dockerfile
      target: production
    container_name: transcripthub-collab-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/transcripthub
      COLLAB_SERVICE_TCP_PORT: 3007
      MEETING_SERVICE_HOST: meeting-service
      MEETING_SERVICE_TCP_PORT: 3006
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meeting-service:
        condition: service_started
    networks:
      - transcripthub_net

  # 4f. Collab Gateway (WebSocket :3008)
  collab-gateway:
    build:
      context: ./services_ms
      dockerfile: apps/collab-gateway/Dockerfile
      target: production
    container_name: transcripthub-collab-gateway
    restart: always
    environment:
      WS_PORT: 3008
      COLLAB_SERVICE_HOST: collab-service
      COLLAB_SERVICE_PORT: 3007
      IDENTITY_SERVICE_HOST: identity-service
      IDENTITY_SERVICE_PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "th_jwt_s3cr3t_k3y_x9mK2pL8qR4nW6vY1bZ5cE0aF7gH3jN"
    ports:
      - "3008:3008"
    depends_on:
      - collab-service
      - redis
      - identity-service
    networks:
      - transcripthub_net

  # 5. API Gateway (HTTP :3000)
  api-gateway:
    build:
      context: ./services_ms
      dockerfile: apps/api-gateway/Dockerfile
      target: production
    container_name: transcripthub-api-gateway
    restart: always
    environment:
      PORT: 3000
      USERS_SERVICE_HOST: users-service
      USERS_SERVICE_PORT: 3001
      IDENTITY_SERVICE_HOST: identity-service
      IDENTITY_SERVICE_PORT: 3002
      FILE_SERVICE_HOST: file-service
      FILE_SERVICE_PORT: 3003
      FILE_SERVICE_TCP_PORT: 3004
      TRANSCRIPT_SERVICE_HOST: transcript-service
      TRANSCRIPT_SERVICE_TCP_PORT: 3005
      MEETING_SERVICE_HOST: meeting-service
      MEETING_SERVICE_TCP_PORT: 3006
      COLLAB_SERVICE_HOST: collab-service
      COLLAB_SERVICE_TCP_PORT: 3007
    ports:
      - "3000:3000"
    depends_on:
      - users-service
      - identity-service
      - file-service
      - transcript-service
      - meeting-service
      - collab-service
    networks:
      - transcripthub_net

  # 6. pgAdmin for PostgreSQL Database management
  pgadmin:
    image: dpage/pgadmin4
    container_name: transcripthub-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - transcripthub_net

volumes:
  postgres_data:
  minio_data:

networks:
  transcripthub_net:
    driver: bridge
