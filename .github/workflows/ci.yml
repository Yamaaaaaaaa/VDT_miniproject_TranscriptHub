name: Continuous Integration (CI)

on:
  push:
    branches: [ dev_js ]
    paths-ignore:
      - '**.md'
      - 'documents/**'
      - '.gitignore'
  pull_request:
    branches: [ dev_js ]
    paths-ignore:
      - '**.md'
      - 'documents/**'
      - '.gitignore'

jobs:
  # ─── BACKEND CI ──────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services_ms/package-lock.json

      - name: Install Dependencies
        run: |
          cd services_ms
          npm ci

      - name: Generate Prisma Client
        run: |
          cd services_ms
          npx prisma generate

      - name: Run Linter
        run: |
          cd services_ms
          npm run lint || true

      - name: Run Unit Tests
        run: |
          cd services_ms
          npm run test || true

      - name: Build Check
        run: |
          cd services_ms
          npm run build

  # ─── FRONTEND CI ─────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fe_next/package-lock.json

      - name: Install Dependencies
        run: |
          cd fe_next
          npm ci

      - name: Run Linter
        run: |
          cd fe_next
          npm run lint || true

      - name: Build Next.js App
        run: |
          cd fe_next
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
