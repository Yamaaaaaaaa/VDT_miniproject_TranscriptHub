name: Continuous Integration (CI)

on:
  push:
    branches: [ dev_js ]
    paths-ignore:
      - '**.md'
      - 'documents/**'
      - '.gitignore'
  pull_request:
    branches: [ dev_js ]
    paths-ignore:
      - '**.md'
      - 'documents/**'
      - '.gitignore'

permissions:
  contents: read
  issues: write

jobs:
  # ─── BACKEND CI ──────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services_ms/package-lock.json

      - name: Install Dependencies
        run: |
          cd services_ms
          npm ci

      - name: Generate Prisma Client
        run: |
          cd services_ms
          npx prisma generate

      - name: Run Linter
        run: |
          cd services_ms
          npm run lint > ../error.log 2>&1 || true

      - name: Run Unit Tests
        run: |
          cd services_ms
          npm run test > ../error.log 2>&1

      - name: Build Check
        run: |
          cd services_ms
          npm run build > ../error.log 2>&1

      - name: Run AI Agent Analyzer
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install @google/generative-ai
          node scripts/analyze-ci-error.js > ai_analysis.md || true

      - name: Create Issue with AI Analysis
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let aiContent = "";
            try {
              aiContent = fs.readFileSync('ai_analysis.md', 'utf8');
            } catch (e) {
              aiContent = "Không thể lấy kết quả phân tích từ AI.";
            }

            const bodyText = `
            ## 🚨 Phát hiện Lỗi CI/CD Pipeline
            - **Tác giả commit:** @${context.actor}
            - **Log link:** [Xem chi tiết tại đây](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ---
            
            ### 🤖 AI Agent Phân tích & Đề xuất cách sửa:
            ${aiContent}
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: `ci-fail-${context.job}`
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[AI Alert] Lỗi build tại Job: ${context.job}`,
                body: bodyText,
                labels: ['bug', `ci-fail-${context.job}`],
                assignees: [context.actor]
              });
            }

      - name: Send Discord Alert on Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "❌ Job [${{ github.job }}] Gặp Sự Cố!"
          description: |
            **Repository**: `${{ github.repository }}`
            **Branch**: `${{ github.ref_name }}`
            **Commit**: `${{ github.sha }}` bởi @${{ github.actor }}
            **Link Log**: [Xem chi tiết tại đây](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xff0000

  # ─── FRONTEND CI ─────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fe_next/package-lock.json

      - name: Install Dependencies
        run: |
          cd fe_next
          npm ci

      - name: Run Linter
        run: |
          cd fe_next
          npm run lint > ../error.log 2>&1 || true

      - name: Build Next.js App
        run: |
          cd fe_next
          npm run build > ../error.log 2>&1
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run AI Agent Analyzer
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install @google/generative-ai
          node scripts/analyze-ci-error.js > ai_analysis.md || true

      - name: Create Issue with AI Analysis
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let aiContent = "";
            try {
              aiContent = fs.readFileSync('ai_analysis.md', 'utf8');
            } catch (e) {
              aiContent = "Không thể lấy kết quả phân tích từ AI.";
            }

            const bodyText = `
            ## 🚨 Phát hiện Lỗi CI/CD Pipeline
            - **Tác giả commit:** @${context.actor}
            - **Log link:** [Xem chi tiết tại đây](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ---
            
            ### 🤖 AI Agent Phân tích & Đề xuất cách sửa:
            ${aiContent}
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: `ci-fail-${context.job}`
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[AI Alert] Lỗi build tại Job: ${context.job}`,
                body: bodyText,
                labels: ['bug', `ci-fail-${context.job}`],
                assignees: [context.actor]
              });
            }

      - name: Send Discord Alert on Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "❌ Job [${{ github.job }}] Gặp Sự Cố!"
          description: |
            **Repository**: `${{ github.repository }}`
            **Branch**: `${{ github.ref_name }}`
            **Commit**: `${{ github.sha }}` bởi @${{ github.actor }}
            **Link Log**: [Xem chi tiết tại đây](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xff0000
