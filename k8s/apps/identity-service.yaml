apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: transcripthub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity-service
        image: yourusername/transcripthub-identity:latest
        ports:
        - name: tcp-port
          containerPort: 3002
        - name: http-port
          containerPort: 3009
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        env:
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: DATABASE_HOST
        - name: database-password
          valueFrom:
            secretKeyRef:
              name: transcripthub-secrets
              key: database-password
        - name: DATABASE_URL
          value: "postgresql://postgres:$(database-password)@$(DATABASE_HOST):5432/transcripthub"
        - name: USERS_SERVICE_HOST
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: USERS_SERVICE_HOST
        - name: USERS_SERVICE_PORT
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: USERS_SERVICE_PORT
        - name: IDENTITY_SERVICE_PORT
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: IDENTITY_SERVICE_PORT
        - name: IDENTITY_HTTP_PORT
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: IDENTITY_HTTP_PORT
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: REDIS_PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: transcripthub-secrets
              key: jwt-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: transcripthub-secrets
              key: jwt-refresh-secret
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: transcripthub
spec:
  ports:
  - name: tcp-port
    port: 3002
    targetPort: 3002
  - name: http-port
    port: 3009
    targetPort: 3009
  selector:
    app: identity-service
  type: ClusterIP
