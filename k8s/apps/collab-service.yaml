apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-service
  namespace: transcripthub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collab-service
  template:
    metadata:
      labels:
        app: collab-service
    spec:
      containers:
      - name: collab-service
        image: yourusername/transcripthub-collab:latest
        ports:
        - containerPort: 3007
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        env:
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: DATABASE_HOST
        - name: database-password
          valueFrom:
            secretKeyRef:
              name: transcripthub-secrets
              key: database-password
        - name: DATABASE_URL
          value: "postgresql://postgres:$(database-password)@$(DATABASE_HOST):5432/transcripthub"
        - name: COLLAB_SERVICE_TCP_PORT
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: COLLAB_SERVICE_TCP_PORT
        - name: MEETING_SERVICE_HOST
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: MEETING_SERVICE_HOST
        - name: MEETING_SERVICE_TCP_PORT
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: MEETING_SERVICE_TCP_PORT
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: REDIS_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: collab-service
  namespace: transcripthub
spec:
  ports:
  - port: 3007
    targetPort: 3007
  selector:
    app: collab-service
  type: ClusterIP
