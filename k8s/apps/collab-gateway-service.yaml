apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-gateway
  namespace: transcripthub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collab-gateway
  template:
    metadata:
      labels:
        app: collab-gateway
    spec:
      containers:
      - name: collab-gateway
        image: yourusername/transcripthub-collab-gateway:latest
        ports:
        - containerPort: 3008
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        env:
        - name: WS_PORT
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: WS_PORT
        - name: IDENTITY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: IDENTITY_SERVICE_URL
        - name: COLLAB_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: COLLAB_SERVICE_URL
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: REDIS_PORT
        - name: ROLE_CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: ROLE_CACHE_TTL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: LOG_LEVEL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: transcripthub-secrets
              key: jwt-secret
---
apiVersion: v1
kind: Service
metadata:
  name: collab-gateway-service
  namespace: transcripthub
spec:
  ports:
  - port: 3008
    targetPort: 3008
  selector:
    app: collab-gateway
  type: ClusterIP
