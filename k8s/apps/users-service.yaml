apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: transcripthub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
      - name: users-service
        image: yourusername/transcripthub-users:latest
        ports:
        - containerPort: 3001
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        env:
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: DATABASE_HOST
        - name: database-password
          valueFrom:
            secretKeyRef:
              name: transcripthub-secrets
              key: database-password
        - name: DATABASE_URL
          value: "postgresql://postgres:$(database-password)@$(DATABASE_HOST):5432/transcripthub"
        - name: USERS_SERVICE_PORT
          valueFrom:
            configMapKeyRef:
              name: transcripthub-config
              key: USERS_SERVICE_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: transcripthub
spec:
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: users-service
  type: ClusterIP
