apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: transcripthub
spec:
  serviceName: minio-service
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command: ["minio", "server", "/data", "--console-address", ":9001"]
        ports:
        - name: api
          containerPort: 9000
        - name: console
          containerPort: 9001
        env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
        - name: MINIO_SERVER_URL
          value: "http://p-bookland.io.vn"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: minio-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: minio-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: transcripthub
spec:
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
  selector:
    app: minio
  type: ClusterIP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: transcripthub
spec:
  template:
    spec:
      containers:
      - name: mc
        image: minio/mc:latest
        command:
        - /bin/sh
        - -c
        - |
          until mc alias set myminio http://minio-service:9000 minioadmin minioadmin; do
            echo "Waiting for MinIO API to start..."
            sleep 2
          done
          mc mb myminio/transcripthub-bucket || true
          mc anonymous set none myminio/transcripthub-bucket || true
          echo "MinIO Bucket initialized successfully."
      restartPolicy: OnFailure
