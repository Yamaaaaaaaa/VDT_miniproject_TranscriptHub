<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Yjs - Transcript Segments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        .segment-card {
            transition: all 0.2s ease;
        }
        .segment-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .segment-card.active {
            border-left: 4px solid #3b82f6;
            background: #eff6ff;
        }
        .editing {
            background: #fef3c7 !important;
        }
        .user-cursor {
            position: absolute;
            width: 2px;
            height: 20px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .online-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        /* CodeMirror styling */
        .cm-editor {
            font-size: 14px;
            min-height: 60px;
            background: white;
        }
        .cm-editor.cm-focused {
            outline: none;
        }
        .cm-content {
            padding: 12px;
            font-family: inherit;
        }
        .cm-line {
            padding: 0;
        }
        .cm-editor .cm-scroller {
            overflow: auto;
        }
        /* Collaborative cursor styling */
        .cm-ySelectionInfo {
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            color: white;
            white-space: nowrap;
        }
        .cm-ySelectionCaret {
            border-left: 2px solid;
            margin-left: -1px;
            margin-right: -1px;
            box-sizing: border-box;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Transcript Collaboration Demo</h1>
                    <p class="text-gray-500 text-sm mt-1">Y.Array + Y.Map với Yjs & WebSocket</p>
                </div>
                <div class="flex items-center gap-4">
                    <div id="user-info" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-sm"></div>
                    <div id="connection-status" class="flex items-center gap-2 px-3 py-1.5 bg-gray-100 rounded-full text-sm">
                        <span class="online-badge bg-gray-400"></span>
                        <span>Offline</span>
                    </div>
                    <div class="flex items-center gap-2 px-3 py-1.5 bg-blue-50 rounded-full text-sm text-blue-600">
                        <span>👥</span>
                        <span id="online-count">0</span> online
                    </div>
                </div>
            </div>
            
            <!-- Online Users List -->
            <div id="online-users-list" class="flex flex-wrap gap-2 mt-4">
            </div>
            
            <!-- Controls -->
            <div class="flex gap-3">
                <input type="text" id="room-id" value="transcript-demo" placeholder="Room ID"
                    class="flex-1 px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-400">
                <button id="btn-join" class="px-6 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600 transition">
                    Tham gia
                </button>
                <button id="btn-add-segment" class="px-6 py-2 bg-green-500 text-white rounded-xl hover:bg-green-600 transition">
                    + Thêm Segment
                </button>
            </div>
        </div>

        <!-- Segments List -->
        <div id="segments-container" class="space-y-4">
            <div class="text-center py-12 text-gray-400">
                <p class="text-lg">Chưa có segment nào</p>
                <p class="text-sm mt-2">Nhấn "Tham gia" để bắt đầu hoặc thêm segment mới</p>
            </div>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
